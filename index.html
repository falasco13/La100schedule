<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA 100 - Sistema de Pautado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg-base: #0A0B10;
  --bg-surface: #11131B;
  --bg-card: #141724;
  --bg-card-hover: #191D2E;
  
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.18);
  
  --text-main: #FFFFFF;
  --text-muted: #8E94A5;
  --text-dim: #5B6175;
  
  /* Colores oficiales de módulo */
  --col-coord: #1B1F6E;
  --col-coord-glow: #3E4BDE;
  --col-sched: #0B6B48;
  --col-sched-glow: #10B981;
  --col-inter: #FF5722;
  --col-inter-glow: #FF7043;
  
  --radius-card: 18px;
  --radius-pill: 9999px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg-base);
  background-image: 
    radial-gradient(circle at 50% -10%, rgba(35, 42, 74, 0.35) 0%, transparent 60%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.015) 0%, transparent 100%);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---------------- NAV BAR ---------------- */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 56px;
  background: rgba(10, 11, 16, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 24px;
}

.nav-inner {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand-link {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}

.logo-svg {
  height: 28px;
  width: auto;
  display: block;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.02em;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #10B981;
  box-shadow: 0 0 10px #10B981;
}

/* ---------------- HEADER ---------------- */
.header-section {
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
  padding: 60px 24px 36px;
  text-align: center;
}

.header-section h1 {
  font-size: 2.5rem;
  font-weight: 800;
  letter-spacing: -0.035em;
  color: var(--text-main);
  margin-bottom: 10px;
}

.header-section p {
  font-size: 1rem;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: -0.01em;
}

/* ---------------- GRID DE MÓDULOS ---------------- */
.container {
  flex: 1;
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
  padding: 0 24px 60px;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.module-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  overflow: hidden;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  transition: transform 0.28s var(--ease), border-color 0.28s var(--ease), box-shadow 0.28s var(--ease), background 0.28s var(--ease);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
}

.module-card:hover {
  transform: translateY(-4px);
  background: var(--bg-card-hover);
  border-color: var(--border-hover);
}

/* Franjas superiores de color temático */
.card-stripe {
  height: 4px;
  width: 100%;
  transition: height 0.2s var(--ease), box-shadow 0.2s var(--ease);
}

.stripe-coord {
  background: var(--col-coord);
}
.module-card:hover .stripe-coord {
  box-shadow: 0 0 16px var(--col-coord-glow);
  background: linear-gradient(90deg, var(--col-coord), var(--col-coord-glow));
}

.stripe-sched {
  background: var(--col-sched);
}
.module-card:hover .stripe-sched {
  box-shadow: 0 0 16px var(--col-sched-glow);
  background: linear-gradient(90deg, var(--col-sched), var(--col-sched-glow));
}

.stripe-inter {
  background: var(--col-inter);
}
.module-card:hover .stripe-inter {
  box-shadow: 0 0 16px var(--col-inter-glow);
  background: linear-gradient(90deg, var(--col-inter), var(--col-inter-glow));
}

/* Contenido de la tarjeta */
.card-body {
  padding: 32px 26px;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.card-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.025em;
  margin-bottom: 10px;
}

.card-desc {
  font-size: 0.88rem;
  color: var(--text-muted);
  line-height: 1.55;
  letter-spacing: -0.01em;
}

/* ---------------- RESPONSIVE ---------------- */
@media (max-width: 860px) {
  .cards-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .header-section {
    padding: 40px 20px 24px;
  }
  .header-section h1 {
    font-size: 2rem;
  }
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="brand-link" title="La 100 FM 99.9">
      <!-- Logotipo Oficial Vectorial LA 100 -->
      <svg class="logo-svg" viewBox="0 0 160 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="LA 100">
        <g fill="#FFFFFF">
          <!-- L -->
          <path d="M10 8h6v18h12v6H10V8z"/>
          <!-- A -->
          <path fill-rule="evenodd" clip-rule="evenodd" d="M36 8h7l10 24h-6.8l-2.2-5.5h-9l-2.2 5.5H26L36 8zm4.5 5.8l-3.1 7.7h6.2l-3.1-7.7z"/>
          <!-- 1 -->
          <path d="M68 13.5l-6 4V12.2l6.8-4.2h6.2v24H68V13.5z"/>
          <!-- 0 -->
          <path fill-rule="evenodd" clip-rule="evenodd" d="M102 7c10 0 16 7.5 16 17s-6 17-16 17-16-7.5-16-17 6-17 16-17zm0 6c-6 0-9 4.8-9 11s3 11 9 11 9-4.8 9-11-3-11-9-11z"/>
          <!-- 0 -->
          <path fill-rule="evenodd" clip-rule="evenodd" d="M140 7c10 0 16 7.5 16 17s-6 17-16 17-16-7.5-16-17 6-17 16-17zm0 6c-6 0-9 4.8-9 11s3 11 9 11 9-4.8 9-11-3-11-9-11z"/>
        </g>
      </svg>
    </a>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>FM 99.9</span>
    </div>
  </div>
</nav>

<header class="header-section">
  <h1>Sistema de Pautado</h1>
  <p>Seleccioná el módulo con el que querés trabajar.</p>
</header>

<main class="container">
  <div class="cards-grid">

    <!-- Tarjeta 1: Coordinador -->
    <a href="coordinador.html" class="module-card">
      <div class="card-stripe stripe-coord"></div>
      <div class="card-body">
        <h2 class="card-title">Asignar materiales (Coordinador)</h2>
        <p class="card-desc">Asignación de artistas y promos hora por hora.</p>
      </div>
    </a>

    <!-- Tarjeta 2: Schedule Builder -->
    <a href="schedule.html" class="module-card">
      <div class="card-stripe stripe-sched"></div>
      <div class="card-body">
        <h2 class="card-title">Schedule Builder</h2>
        <p class="card-desc">Armado de tandas y exportación a Excel.</p>
      </div>
    </a>

    <!-- Tarjeta 3: Intertandas -->
    <a href="intertandas.html" class="module-card">
      <div class="card-stripe stripe-inter"></div>
      <div class="card-body">
        <h2 class="card-title">Intertandas</h2>
        <p class="card-desc">Generación y revisión de intertandas con antichoques.</p>
      </div>
    </a>

  </div>
</main>

</body>
</html>
